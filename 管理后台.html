<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
:root {
  --red: #8B3A3A; --red-light: #A05252; --red-dark: #5C2828;
  --gold: #C9A96E; --gold-light: #E0D0A8;
  --jade: #5B8C5A; --jade-light: #A8C8A0;
  --lake: #4A7A8C; --lake-dark: #2C4A5A;
  --ink: #2C2C2C; --ink-light: #666;
  --paper: #FDFAF5;
  --sidebar-bg: #1A2530; --sidebar-hover: #243040; --sidebar-active: #2C3D50;
  --bg: #F0F2F5;
  --card: #fff;
  --border: #E8E8E8;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; display:flex; min-height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 220px; background: var(--sidebar-bg); color: #B0C0D0;
  display:flex; flex-direction:column; flex-shrink:0; position:fixed;
  top:0; left:0; bottom:0; z-index:100; overflow-y:auto;
}
.sidebar-logo {
  padding: 20px 18px; border-bottom:1px solid rgba(255,255,255,0.06);
  text-align:center;
}
.sidebar-logo .logo-icon { font-size:32px; }
.sidebar-logo .logo-text { font-size:15px; font-weight:700; color:#fff; margin-top:4px; letter-spacing:2px; }
.sidebar-logo .logo-sub { font-size:10px; color:#607080; letter-spacing:1px; }
.sidebar-menu { flex:1; padding:10px 0; }
.sidebar-group {
  font-size:10px; color:#506070; padding:14px 18px 6px;
  text-transform:uppercase; letter-spacing:2px; font-weight:600;
}
.sidebar-item {
  padding:10px 18px; cursor:pointer; display:flex; align-items:center;
  gap:8px; font-size:13px; transition:all 0.15s; border-left:2px solid transparent;
}
.sidebar-item:hover { background:var(--sidebar-hover); color:#D0D8E0; }
.sidebar-item.active { background:var(--sidebar-active); color:#fff; border-left-color:var(--gold); font-weight:600; }
.sidebar-item .si-icon { font-size:16px; width:22px; text-align:center; }
.sidebar-footer {
  padding:14px 18px; border-top:1px solid rgba(255,255,255,0.06);
  font-size:11px; color:#506070;
}

/* ===== MAIN ===== */
.main {
  margin-left:220px; flex:1; padding:24px 28px; min-height:100vh;
}

/* Top bar */
.topbar {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:24px;
}
.topbar h1 { font-size:20px; font-weight:700; color:var(--red-dark); }
.topbar .breadcrumb { font-size:11px; color:var(--ink-light); }
.topbar .admin-info { font-size:12px; color:var(--ink-light); }

/* Cards */
.card {
  background:var(--card); border-radius:12px; padding:20px 24px;
  margin-bottom:16px; box-shadow:var(--shadow);
}
.card-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border);
}
.card-header h3 { font-size:15px; color:var(--ink); }
.card-header .actions { display:flex; gap:8px; }

/* Stat row */
.stat-row { display:flex; gap:16px; margin-bottom:16px; }
.stat-card {
  flex:1; background:var(--card); border-radius:12px; padding:18px 20px;
  box-shadow:var(--shadow); text-align:center;
}
.stat-card .stat-icon { font-size:28px; margin-bottom:4px; }
.stat-card .stat-val { font-size:28px; font-weight:900; }
.stat-card .stat-label { font-size:11px; color:var(--ink-light); margin-top:2px; }
.stat-card.red .stat-val { color:var(--red); }
.stat-card.gold .stat-val { color:var(--gold); }
.stat-card.jade .stat-val { color:var(--jade); }
.stat-card.lake .stat-val { color:var(--lake); }

/* Tables */
table {
  width:100%; border-collapse:collapse; font-size:12px;
}
th {
  background:#F8F9FA; padding:10px 12px; text-align:left;
  font-weight:600; color:#555; border-bottom:2px solid #EEE;
}
td { padding:10px 12px; border-bottom:1px solid #F0F0F0; }
tr:hover td { background:#FAFAF8; }

/* Tags */
.tag {
  display:inline-block; padding:2px 8px; border-radius:10px;
  font-size:10px; font-weight:600; margin:0 2px;
}
.tag.on { background:#E8F5E8; color:var(--jade); }
.tag.off { background:#F5F5F5; color:#999; }
.tag.red { background:#FDF0F0; color:var(--red); }
.tag.gold { background:#FDF6EC; color:var(--gold); }

/* Buttons */
.btn {
  display:inline-block; padding:8px 18px; border-radius:8px;
  font-size:12px; font-weight:600; border:none; cursor:pointer;
  transition:all 0.15s;
}
.btn:hover { opacity:0.85; }
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--lake); color:#fff; }
.btn-success { background:var(--jade); color:#fff; }
.btn-danger { background:#E8D0D0; color:var(--red); }
.btn-gold { background:var(--gold); color:#fff; }
.btn-sm { padding:4px 10px; font-size:11px; }
.btn-xs { padding:2px 8px; font-size:10px; border-radius:6px; }

/* Forms */
.form-group {
  display:flex; align-items:flex-start; gap:12px; margin-bottom:10px;
}
.form-group label {
  width:90px; text-align:right; font-size:12px; color:var(--ink-light);
  padding-top:8px; flex-shrink:0;
}
.form-group input, .form-group textarea, .form-group select {
  flex:1; padding:8px 12px; border:1px solid #DDD; border-radius:6px;
  font-size:12px; outline:none; font-family:inherit;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color:var(--lake);
}
.form-group textarea { resize:vertical; min-height:60px; }

/* Modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.25s;
}
.modal-overlay.show { opacity:1; pointer-events:auto; }
.modal {
  background:#fff; border-radius:14px; width:90%; max-width:680px; max-height:85vh;
  overflow-y:auto; box-shadow:0 12px 48px rgba(0,0,0,0.2);
}
.modal-header {
  padding:16px 20px; border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
  font-size:15px; font-weight:700;
}
.modal-close { cursor:pointer; font-size:20px; color:#999; background:none; border:none; }
.modal-body { padding:20px; }
.modal-footer {
  padding:14px 20px; border-top:1px solid var(--border);
  display:flex; justify-content:flex-end; gap:8px;
}

/* Toast */
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  background:#333; color:#fff; padding:10px 24px; border-radius:20px;
  font-size:13px; z-index:9999; pointer-events:none;
  opacity:0; transition:all 0.3s;
}
.toast.show { opacity:1; }

/* Sections */
.section { display:none; }
.section.active { display:block; }

/* Responsive */
@media (max-width:768px) {
  .sidebar { width:160px; }
  .main { margin-left:160px; padding:16px; }
  .stat-row { flex-wrap:wrap; }
  .stat-card { min-width:calc(50% - 8px); }
  .form-group { flex-direction:column; }
  .form-group label { width:auto; text-align:left; padding-top:0; }
}
</style>

let DB = loadDB();

// ==================== PAGE SWITCH ====================
function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  renderPage(page);
}

// ==================== RENDER ====================
function renderPage(page) {
  const main = document.getElementById('mainContent');
  switch(page) {
    case 'dashboard': renderDashboard(main); break;
    case 'routes': renderRoutePage(main); break;
    case 'foods': renderFoodPage(main); break;
    case 'scenic': renderScenicPage(main); break;
    case 'tips': renderTipsPage(main); break;
    case 'password': renderPasswordPage(main); break;
    case 'config': renderConfigPage(main); break;

}

function closeRouteModal() {
  document.getElementById('routeModal').innerHTML = '';
  window._editingRoute = null;
  window._editingRouteIsNew = null;
}

function syncFormToEditingRoute() {
  // BUG-002 fix: collect current DOM form values before modal rebuild
  if (!window._editingRoute) return;
  const r = window._editingRoute;
  r.name = document.getElementById('rName')?.value || r.name;
  r.type = document.getElementById('rType')?.value || r.type;
  r.intro = document.getElementById('rIntro')?.value || r.intro;
  r.active = document.getElementById('rActive')?.value === '1';

  // Collect days
  const daysContainer = document.getElementById('daysContainer');
  if (daysContainer) {
    const dayDivs = daysContainer.children;
    const newDays = [];
    for (let di = 0; di < dayDivs.length; di++) {
      const labelEl = document.getElementById('dayLabel'+di);
      const label = labelEl?.value || '';
      const items = [];
      const itemsDiv = document.getElementById('dayItems'+di);
      if (itemsDiv) {
        const itemRows = itemsDiv.children;
        for (let ii = 0; ii < itemRows.length; ii++) {
          const timeEl = document.getElementById('itemTime'+di+'_'+ii);
          const placeEl = document.getElementById('itemPlace'+di+'_'+ii);
          const descEl = document.getElementById('itemDesc'+di+'_'+ii);
          const tipEl = document.getElementById('itemTip'+di+'_'+ii);
          if (placeEl || timeEl) {
            items.push({
              time: timeEl?.value || '',
              place: placeEl?.value || '',
              desc: descEl?.value || '',
              tip: tipEl?.value || ''
            });
          }
        }
      }
      newDays.push({ label, items });
    }
    r.days = newDays;
  }
}

function addRouteDay() {
  // BUG-002 fix: sync form data first
  syncFormToEditingRoute();
  if (!window._editingRoute) return;
  window._editingRoute.days.push({ label:'', items:[] });
  const clone = JSON.parse(JSON.stringify(window._editingRoute));
  const isNew = window._editingRouteIsNew;
  closeRouteModal();
  setTimeout(() => {
    window._editingRoute = clone;
    window._editingRouteIsNew = isNew;
    document.getElementById('routeModal').innerHTML = buildRouteModalHTML(clone, isNew);

}

function removeRouteDay(di) {
  syncFormToEditingRoute();
  if (!window._editingRoute) return;
  window._editingRoute.days.splice(di, 1);
  const clone = JSON.parse(JSON.stringify(window._editingRoute));
  const isNew = window._editingRouteIsNew;
  closeRouteModal();
  setTimeout(() => {
    window._editingRoute = clone;
    window._editingRouteIsNew = isNew;
    document.getElementById('routeModal').innerHTML = buildRouteModalHTML(clone, isNew);
  }, 30);
}

function saveRoute(id, isNew) {
  const name = document.getElementById('rName')?.value || '';
  const type = document.getElementById('rType')?.value || 'day1';
  const intro = document.getElementById('rIntro')?.value || '';
  const active = document.getElementById('rActive')?.value === '1';
  // Collect days
  const days = [];
  const daysContainer = document.getElementById('daysContainer');
  if (daysContainer) {
    const dayDivs = daysContainer.children;
    for (let di = 0; di < dayDivs.length; di++) {
      const labelEl = document.getElementById('dayLabel'+di);
      const label = labelEl?.value || '';
      const items = [];
      const itemsDiv = document.getElementById('dayItems'+di);
      if (itemsDiv) {
        const itemRows = itemsDiv.children;
        for (let ii = 0; ii < itemRows.length; ii++) {
          const timeEl = document.getElementById('itemTime'+di+'_'+ii);
          const placeEl = document.getElementById('itemPlace'+di+'_'+ii);
          const descEl = document.getElementById('itemDesc'+di+'_'+ii);
          const tipEl = document.getElementById('itemTip'+di+'_'+ii);
          if (placeEl?.value || timeEl?.value) {
            items.push({
              time: timeEl?.value || '',
              place: placeEl?.value || '',
              desc: descEl?.value || '',
              tip: tipEl?.value || ''
            });
          }
        }
      }
      if (label || items.length > 0) days.push({ label, items });
    }
  }
  const routeData = { id, name, type, intro, active, days };

  if (isNew) {
    DB.routes.push(routeData);
  } else {
    const idx = DB.routes.findIndex(r => r.id === id);
    if (idx >= 0) DB.routes[idx] = routeData;
  }
  saveDB(DB);
  closeRouteModal();
  showToast('✅ 路线保存成功！');
  renderRoutePage(document.getElementById('mainContent'));
}

function toggleRoute(id) {
  const r = DB.routes.find(r => r.id === id);
  if (r) { r.active = !r.active; saveDB(DB); showToast(r.active?'✅ 已启用':'👻 已隐藏'); }
  renderRoutePage(document.getElementById('mainContent'));
}

function deleteRoute(id) {
  if (!confirm('确定删除这条路线吗？')) return;
  DB.routes = DB.routes.filter(r => r.id !== id);
  saveDB(DB);
  showToast('🗑 路线已删除');
  renderRoutePage(document.getElementById('mainContent'));
}

}

function exportData() {
  touchModified();
  const json = JSON.stringify(DB, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'data.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('📥 数据已导出为 data.json · 可直接上传到COS');
}

function copyDataJSON() {
  touchModified();
  const json = JSON.stringify(DB, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(() => {
      showToast('✅ JSON已复制到剪贴板 · 可直接粘贴上传');
    }).catch(() => {
      showToast('⚠️ 复制失败，请使用导出按钮');
    });
  } else {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = json; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('✅ JSON已复制到剪贴板'); }
    catch(e) { showToast('⚠️ 复制失败，请使用导出按钮下载文件'); }
    document.body.removeChild(ta);
  }
}

function resetData() {
  if (!confirm('⚠️ 确定恢复默认数据？当前数据将丢失！\n建议先导出备份。')) return;
  DB = getDefaultDB(); saveDB(DB);
  showToast('✅ 已恢复默认数据');
  renderPage(currentPage);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== INIT =====
function init() {
  DB = loadDB();
  renderPage('dashboard');
}

document.addEventListener('DOMContentLoaded', init);
