<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山居后台">
<link rel="manifest" href="./manifest.json">
<title>水泉沟·山居 — 总管后台</title>
<style>
:root { --red:#8B3A3A; --gold:#C9A96E; --jade:#5B8C5A; --lake:#4A7A8C; --bg:#F0F2F5; --card:#fff; --border:#E8E8E8; --shadow:0 2px 12px rgba(0,0,0,0.06); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#2C2C2C; }

/* === SIDEBAR === */
.layout { display:flex; min-height:100vh; }
.sidebar { width:210px; background:#1A2530; color:#B0C0D0; flex-shrink:0; display:flex; flex-direction:column; }
.sidebar-logo { padding:18px 16px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.06); }
.sidebar-logo .icon { font-size:28px; }
.sidebar-logo .name { font-size:14px; font-weight:700; color:#fff; letter-spacing:2px; }
.sidebar-logo .sub { font-size:9px; color:#506070; }
.sidebar-group { font-size:9px; color:#506070; padding:14px 16px 6px; text-transform:uppercase; letter-spacing:2px; }
.sidebar-item { padding:9px 16px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12px; border-left:2px solid transparent; }
.sidebar-item:hover { background:rgba(255,255,255,0.04); color:#D0D8E0; }
.sidebar-item.active { background:rgba(255,255,255,0.06); color:#fff; border-left-color:var(--gold); }
.sidebar-item .si { font-size:15px; width:20px; text-align:center; }
.sidebar-footer { padding:14px 16px; border-top:1px solid rgba(255,255,255,0.06); font-size:10px; color:#506070; margin-top:auto; }

/* === MAIN === */
.main { flex:1; padding:20px 24px; overflow-y:auto; }
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.topbar h1 { font-size:18px; color:#5C2828; }
.topbar .publish-bar { display:flex; align-items:center; gap:10px; }

.card { background:var(--card); border-radius:12px; padding:18px 22px; margin-bottom:14px; box-shadow:var(--shadow); }
.card h3 { font-size:14px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:6px; }

.stat-row { display:flex; gap:12px; margin-bottom:14px; }
.stat-card { flex:1; background:var(--card); border-radius:10px; padding:16px; text-align:center; box-shadow:var(--shadow); }
.stat-card .val { font-size:26px; font-weight:900; }
.stat-card .lbl { font-size:10px; color:#888; margin-top:2px; }

table { width:100%; border-collapse:collapse; font-size:11px; }
th { background:#F8F9FA; padding:8px 10px; text-align:left; font-weight:600; color:#555; border-bottom:2px solid #EEE; }
td { padding:8px 10px; border-bottom:1px solid #F0F0F0; }
tr:hover td { background:#FDFDFC; }

.tag { display:inline-block; padding:2px 7px; border-radius:8px; font-size:9px; font-weight:600; }
.tag.on { background:#E8F5E8; color:var(--jade); }
.tag.off { background:#F5F5F5; color:#999; }
.tag.red { background:#FDF0F0; color:var(--red); }
.tag.gold { background:#FDF6EC; color:var(--gold); }
.tag.green { background:#E8F5E8; color:var(--jade); }

.btn { display:inline-block; padding:7px 15px; border-radius:7px; font-size:11px; font-weight:600; border:none; cursor:pointer; }
.btn:hover { opacity:0.85; }
.btn:active { transform:scale(0.97); }
.btn-pri { background:var(--lake); color:#fff; }
.btn-ok { background:var(--jade); color:#fff; }
.btn-warn { background:#E8D0D0; color:var(--red); }
.btn-gold { background:var(--gold); color:#fff; }
.btn-pub { background:linear-gradient(135deg,var(--red),#C03030); color:#fff; padding:10px 22px; font-size:13px; border-radius:20px; }
.btn-sm { padding:3px 8px; font-size:10px; }

.form-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
.form-row label { width:80px; text-align:right; font-size:11px; color:#666; padding-top:7px; flex-shrink:0; }
.form-row input, .form-row textarea, .form-row select { flex:1; padding:7px 10px; border:1px solid #DDD; border-radius:6px; font-size:11px; outline:none; font-family:inherit; }
.form-row input:focus, .form-row textarea:focus { border-color:var(--lake); }
.form-row textarea { resize:vertical; min-height:50px; }

.toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 20px; border-radius:16px; font-size:12px; z-index:9999; pointer-events:none; opacity:0; transition:opacity 0.3s; }
.toast.show { opacity:1; }

.publish-status { display:flex; align-items:center; gap:6px; font-size:11px; }
.publish-status .dot { width:7px; height:7px; border-radius:50%; }
.publish-status .dot.synced { background:var(--jade); }
.publish-status .dot.unsynced { background:#E0C060; }

/* === Gate === */
.gate-overlay { position:fixed; inset:0; background:var(--bg); z-index:9998; display:flex; align-items:center; justify-content:center; padding:20px; }
.gate-card { background:#fff; border-radius:16px; padding:32px 28px; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.12); width:320px; max-width:100%; }
.gate-card .icon { font-size:48px; margin-bottom:8px; }
.gate-card h2 { font-size:18px; margin-bottom:4px; }
.gate-card .sub { font-size:11px; color:#888; margin-bottom:16px; }
.gate-card input { width:100%; padding:12px 14px; border:1px solid #DDD; border-radius:8px; font-size:16px; text-align:center; outline:none; letter-spacing:4px; font-family:monospace; -webkit-appearance:none; }
.gate-card input:focus { border-color:var(--gold); }
.gate-card .err { font-size:10px; color:var(--red); margin-top:6px; display:none; }
.gate-card .hint { font-size:10px; color:#bbb; margin-top:10px; }
.gate-card button { margin-top:12px; width:100%; padding:12px; font-size:15px; border-radius:8px; }

/* === Table scroll wrapper === */
.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* === MOBILE === */
@media (max-width:768px) {
  .layout { flex-direction:column; }
  .sidebar { width:100%; flex-direction:row; overflow-x:auto; padding:4px 6px; flex-shrink:0; }
  .sidebar-logo { display:none; }
  .sidebar-group { display:none; }
  .sidebar-footer { display:none; }
  .sidebar-item { flex-shrink:0; padding:10px 14px; font-size:11px; white-space:nowrap; border-left:none; border-bottom:2px solid transparent; min-height:40px; display:flex; align-items:center; }
  .sidebar-item.active { border-left:none; border-bottom-color:var(--gold); }
  .main { padding:12px; }
  .topbar { flex-direction:column; align-items:flex-start; gap:8px; }
  .stat-row { flex-wrap:wrap; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat-card { min-width:0; padding:12px 8px; }
  .stat-card .val { font-size:22px; }
  .form-row { flex-direction:column; }
  .form-row label { width:auto; text-align:left; padding-top:0; }
  .btn { padding:10px 16px; font-size:12px; min-height:40px; }
  .btn-sm { padding:6px 10px; font-size:11px; min-height:32px; }
  table { font-size:10px; }
  th, td { padding:6px 8px; }
  .card { padding:12px 14px; }
  .gate-card { padding:24px 18px; }
  .gate-card .icon { font-size:40px; }
  .gate-card h2 { font-size:16px; }
  input, select, textarea { font-size:16px !important; }
}

/* Small phone */
@media (max-width:400px) {
  .sidebar-item { padding:8px 10px; font-size:10px; min-height:36px; }
  .sidebar-item .si { font-size:14px; width:16px; }
  .stat-card .val { font-size:20px; }
  .stat-card .lbl { font-size:9px; }
  .topbar h1 { font-size:16px; }
}
</style>
</head>
<body>
<!-- 诊断横幅 -->
<div id="diagBanner" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#e74c3c;color:#fff;text-align:center;padding:4px;font-size:11px;font-weight:bold;pointer-events:none;">
  ⚠️ JavaScript 未运行
</div>
<noscript>
<div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#e74c3c;color:#fff;text-align:center;padding:4px;font-size:11px;">
  ❌ 请启用 JavaScript
</div>
</noscript>

<!-- ===== PASSWORD GATE ===== -->
<div class="gate-overlay" id="gate">
  <div class="gate-card">
    <div class="icon">🔐</div>
    <h2>水泉沟·山居</h2>
    <div class="sub">总管后台 · 请输入管理密码</div>
    <input type="password" id="gatePwd" placeholder="输入密码" maxlength="20" onkeydown="if(event.key==='Enter'&&typeof checkGate==='function')checkGate()" />
    <div class="err" id="gateErr">密码错误，请重试</div>
    <div class="hint">默认密码: <b>chengde2024</b></div>
    <label style="display:flex;align-items:center;gap:6px;justify-content:center;margin-top:10px;font-size:11px;color:#888;cursor:pointer;">
      <input type="checkbox" id="gateRemember" style="width:auto;margin:0;accent-color:var(--gold);" /> 保持登录（下次自动进入）
    </label>
    <button class="btn btn-ok" style="margin-top:12px;width:100%;" onclick="if(typeof checkGate==='function')checkGate();else{alert('JS未加载完成，请刷新页面');location.reload();}">进入后台</button>
  </div>
</div>

<!-- ===== LAYOUT ===== -->
<div class="layout" id="appLayout">
  <div class="sidebar">
    <div class="sidebar-logo"><div class="icon">🏛️</div><div class="name">水泉沟·山居</div><div class="sub">总管后台</div></div>
    <div class="sidebar-group">📊 概览</div>
    <div class="sidebar-item active" data-pg="dash" onclick="nav('dash')"><span class="si">📈</span>数据看板</div>
    <div class="sidebar-group">🏛 内容</div>
    <div class="sidebar-item" data-pg="routes" onclick="nav('routes')"><span class="si">📜</span>游玩路线</div>
    <div class="sidebar-item" data-pg="foods" onclick="nav('foods')"><span class="si">🍜</span>美食推荐</div>
    <div class="sidebar-item" data-pg="scenic" onclick="nav('scenic')"><span class="si">🏯</span>景区管理</div>
    <div class="sidebar-item" data-pg="tips" onclick="nav('tips')"><span class="si">💡</span>每日贴士</div>
    <div class="sidebar-group">⚙️ 系统</div>
    <div class="sidebar-item" data-pg="pwd" onclick="nav('pwd')"><span class="si">🔐</span>门锁密码</div>
    <div class="sidebar-item" data-pg="cfg" onclick="nav('cfg')"><span class="si">⚙️</span>全局设置</div>
    <div class="sidebar-footer">🔗 afei-chi.github.io/shuiquangou<br><a href="javascript:logout()" style="color:#506070;font-size:9px;">🚪 退出登录</a></div>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>


<script src="admin_app.js?v=2"></script>
</body>
</html>
