<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水泉沟·山居 — 总管后台</title>
<style>
:root { --red:#8B3A3A; --gold:#C9A96E; --jade:#5B8C5A; --lake:#4A7A8C; --bg:#F0F2F5; --card:#fff; --border:#E8E8E8; --shadow:0 2px 12px rgba(0,0,0,0.06); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#2C2C2C; }

/* === SIDEBAR === */
.layout { display:flex; min-height:100vh; }
.sidebar { width:210px; background:#1A2530; color:#B0C0D0; flex-shrink:0; display:flex; flex-direction:column; }
.sidebar-logo { padding:18px 16px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.06); }
.sidebar-logo .icon { font-size:28px; }
.sidebar-logo .name { font-size:14px; font-weight:700; color:#fff; letter-spacing:2px; }
.sidebar-logo .sub { font-size:9px; color:#506070; }
.sidebar-group { font-size:9px; color:#506070; padding:14px 16px 6px; text-transform:uppercase; letter-spacing:2px; }
.sidebar-item { padding:9px 16px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12px; border-left:2px solid transparent; }
.sidebar-item:hover { background:rgba(255,255,255,0.04); color:#D0D8E0; }
.sidebar-item.active { background:rgba(255,255,255,0.06); color:#fff; border-left-color:var(--gold); }
.sidebar-item .si { font-size:15px; width:20px; text-align:center; }
.sidebar-footer { padding:14px 16px; border-top:1px solid rgba(255,255,255,0.06); font-size:10px; color:#506070; margin-top:auto; }

/* === MAIN === */
.main { flex:1; padding:20px 24px; overflow-y:auto; }
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.topbar h1 { font-size:18px; color:#5C2828; }
.topbar .publish-bar { display:flex; align-items:center; gap:10px; }

.card { background:var(--card); border-radius:12px; padding:18px 22px; margin-bottom:14px; box-shadow:var(--shadow); }
.card h3 { font-size:14px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:6px; }

.stat-row { display:flex; gap:12px; margin-bottom:14px; }
.stat-card { flex:1; background:var(--card); border-radius:10px; padding:16px; text-align:center; box-shadow:var(--shadow); }
.stat-card .val { font-size:26px; font-weight:900; }
.stat-card .lbl { font-size:10px; color:#888; margin-top:2px; }

table { width:100%; border-collapse:collapse; font-size:11px; }
th { background:#F8F9FA; padding:8px 10px; text-align:left; font-weight:600; color:#555; border-bottom:2px solid #EEE; }
td { padding:8px 10px; border-bottom:1px solid #F0F0F0; }
tr:hover td { background:#FDFDFC; }

.tag { display:inline-block; padding:2px 7px; border-radius:8px; font-size:9px; font-weight:600; }
.tag.on { background:#E8F5E8; color:var(--jade); }
.tag.off { background:#F5F5F5; color:#999; }
.tag.red { background:#FDF0F0; color:var(--red); }
.tag.gold { background:#FDF6EC; color:var(--gold); }
.tag.green { background:#E8F5E8; color:var(--jade); }

.btn { display:inline-block; padding:7px 15px; border-radius:7px; font-size:11px; font-weight:600; border:none; cursor:pointer; }
.btn:hover { opacity:0.85; }
.btn:active { transform:scale(0.97); }
.btn-pri { background:var(--lake); color:#fff; }
.btn-ok { background:var(--jade); color:#fff; }
.btn-warn { background:#E8D0D0; color:var(--red); }
.btn-gold { background:var(--gold); color:#fff; }
.btn-pub { background:linear-gradient(135deg,var(--red),#C03030); color:#fff; padding:10px 22px; font-size:13px; border-radius:20px; }
.btn-sm { padding:3px 8px; font-size:10px; }

.form-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
.form-row label { width:80px; text-align:right; font-size:11px; color:#666; padding-top:7px; flex-shrink:0; }
.form-row input, .form-row textarea, .form-row select { flex:1; padding:7px 10px; border:1px solid #DDD; border-radius:6px; font-size:11px; outline:none; font-family:inherit; }
.form-row input:focus, .form-row textarea:focus { border-color:var(--lake); }
.form-row textarea { resize:vertical; min-height:50px; }

.toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 20px; border-radius:16px; font-size:12px; z-index:9999; pointer-events:none; opacity:0; transition:opacity 0.3s; }
.toast.show { opacity:1; }

.publish-status { display:flex; align-items:center; gap:6px; font-size:11px; }
.publish-status .dot { width:7px; height:7px; border-radius:50%; }
.publish-status .dot.synced { background:var(--jade); }
.publish-status .dot.unsynced { background:#E0C060; }

/* === Gate === */
.gate-overlay { position:fixed; inset:0; background:var(--bg); z-index:9998; display:flex; align-items:center; justify-content:center; }
.gate-card { background:#fff; border-radius:16px; padding:32px 28px; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.12); width:320px; }
.gate-card .icon { font-size:48px; margin-bottom:8px; }
.gate-card h2 { font-size:18px; margin-bottom:4px; }
.gate-card .sub { font-size:11px; color:#888; margin-bottom:16px; }
.gate-card input { width:100%; padding:10px 14px; border:1px solid #DDD; border-radius:8px; font-size:14px; text-align:center; outline:none; letter-spacing:4px; font-family:monospace; }
.gate-card input:focus { border-color:var(--gold); }
.gate-card .err { font-size:10px; color:var(--red); margin-top:6px; display:none; }
.gate-card .hint { font-size:10px; color:#bbb; margin-top:10px; }

/* === MOBILE === */
@media (max-width:768px) {
  .layout { flex-direction:column; }
  .sidebar { width:100%; flex-direction:row; overflow-x:auto; padding:0; flex-shrink:0; }
  .sidebar-logo { display:none; }
  .sidebar-group { display:none; }
  .sidebar-footer { display:none; }
  .sidebar-item { flex-shrink:0; padding:10px 12px; font-size:10px; white-space:nowrap; border-left:none; border-bottom:2px solid transparent; }
  .sidebar-item.active { border-left:none; border-bottom-color:var(--gold); }
  .main { padding:14px; }
  .topbar { flex-direction:column; align-items:flex-start; gap:8px; }
  .stat-row { flex-wrap:wrap; }
  .stat-card { min-width:calc(50% - 6px); }
  .form-row { flex-direction:column; }
  .form-row label { width:auto; text-align:left; padding-top:0; }
}
</style>
</head>
<body>

<!-- ===== PASSWORD GATE ===== -->
<div class="gate-overlay" id="gate">
  <div class="gate-card">
    <div class="icon">🔐</div>

  </div>
</div>

<!-- ===== LAYOUT ===== -->
<div class="layout" id="appLayout">
  <div class="sidebar">
    <div class="sidebar-logo"><div class="icon">🏛️</div><div class="name">水泉沟·山居</div><div class="sub">总管后台</div></div>
    <div class="sidebar-group">📊 概览</div>
    <div class="sidebar-item active" data-pg="dash" onclick="nav('dash')"><span class="si">📈</span>数据看板</div>
    <div class="sidebar-group">🏛 内容</div>
    <div class="sidebar-item" data-pg="routes" onclick="nav('routes')"><span class="si">📜</span>游玩路线</div>
    <div class="sidebar-item" data-pg="foods" onclick="nav('foods')"><span class="si">🍜</span>美食推荐</div>

  <div class="main" id="main"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>

const GATE_PWD = 'chengde2024';
function checkGate() {
  const v = document.getElementById('gatePwd').value.trim();
  if (v === GATE_PWD) {
    document.getElementById('gate').style.display = 'none';
    init();
  } else {
    document.getElementById('gateErr').style.display = 'block';
    document.getElementById('gatePwd').value = '';
  }
}

// ==================== GITHUB CONFIG ====================

const DB_KEY = 'shuiquangou_miniapp_v2';
const META_KEY = 'shuiquangou_meta_v2';
const REMOTE_DATA_URL = 'https://afei-chi.github.io/shuiquangou/data.json';

function getMeta() { try { return JSON.parse(localStorage.getItem(META_KEY)||'{}'); } catch(e) { return {}; } }
function saveMeta(m) { localStorage.setItem(META_KEY, JSON.stringify(m)); }
function touchMod() { const m = getMeta(); m.lastMod = new Date().toISOString(); m.exports = (m.exports||0)+1; saveMeta(m); }

function loadDB() {
  try { const d = localStorage.getItem(DB_KEY); if (d) return JSON.parse(d); } catch(e) {}
  const def = getDefaultDB(); saveDB(def); return def;
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); touchMod(); }

async function syncFromRemote() {
  // 管理端启动时从线上同步最新数据（5秒超时）
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    const resp = await fetch(REMOTE_DATA_URL + '?t=' + Date.now(), { signal: controller.signal });
    clearTimeout(timeout);
    if (resp.ok) {
      const remoteData = await resp.json();
      if (remoteData && remoteData.config) {
        // 合并远程数据到本地（保留本地未发布的修改）
        const local = loadDB();
        const meta = getMeta();
        // 如果本地没有未发布的修改，则直接用远程数据覆盖
        if (!pendingChanges) {
          saveDB(remoteData);
          DB = remoteData;
          window._dataSource = 'remote';
          return true;
        } else {
          // 有未发布修改时，提示用户
          console.log('📌 检测到本地有未发布修改，保留本地数据');
          return false;
        }
      }
    }
  } catch(e) {
    console.warn('⚠️ 远程同步失败，使用本地数据', e.message);
  }
  return false;
}

// 手动触发同步（从看板按钮调用）
async function remoteSync() {
  toast('🔄 正在从线上同步...');
  const synced = await syncFromRemote();
  if (synced) {
    toast('✅ 同步成功！共' + DB.scenicSpots.length + '个景区');
    if (current === 'dash') nav('dash');
  } else {
    toast('⚠️ 同步失败，请检查网络后重试');
  }
}

let DB = loadDB();
let current = 'dash';
let pendingChanges = false;

// ==================== NAV ====================
function nav(pg) {
  current = pg;
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
  document.querySelector(`[data-pg="${pg}"]`)?.classList.add('active');
  render(pg);
}

// ==================== RENDER ====================
function render(pg) {
  const m = document.getElementById('main');
  if (!m) { console.error('❌ main 元素未找到，页面可能未加载完成'); return; }
  switch(pg) {
    case 'dash': dash(m); break;
    case 'routes': routesPg(m); break;
    case 'foods': foodsPg(m); break;
    case 'scenic': scenicPg(m); break;
    case 'tips': tipsPg(m); break;
    case 'pwd': pwdPg(m); break;
    case 'cfg': cfgPg(m); break;
  }
}

// ===== DASH =====

    const lbl = document.getElementById('dl'+di)?.value||'';

    if(nc) for(let ii=0; ii<nc.children.length; ii++) {
      const t = document.getElementById('t'+di+'_'+ii)?.value||'';

    }

  }
  r.days = nd;
}

function addImgUrl() {
  const url = document.getElementById('newImgUrl')?.value.trim();
  if (!url) return;
  if (!window._scenicImgs) window._scenicImgs = [];
  window._scenicImgs.push(url);
  // Rebuild image list in-place
  const list = document.getElementById('scenicImgList');
  if (list) {
    list.innerHTML = window._scenicImgs.map((img,i) => {
      const isUrl = img && (img.startsWith('http://') || img.startsWith('https://'));
      return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;background:#f8f8f8;padding:4px 8px;border-radius:6px;">
        ${isUrl ? `<img src="${img}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;" onerror="this.style.display='none'" />` : `<span style="font-size:24px;">${img||'🖼️'}</span>`}
        <input value="${img}" style="flex:1;font-size:10px;padding:4px;border:1px solid #e0e0e0;border-radius:4px;" onchange="window._scenicImgs[${i}]=this.value" />
        <button onclick="removeScenicImg(${i})" style="border:none;background:#e0e0e0;border-radius:4px;cursor:pointer;padding:2px 6px;font-size:14px;">×</button>
      </div>`;
    }).join('') || '<div style="color:#999;font-size:10px;padding:8px;">暂无图片，点击下方添加</div>';
  }
  document.getElementById('newImgUrl').value = '';
}
function removeScenicImg(idx) {
  if (!window._scenicImgs) return;
  window._scenicImgs.splice(idx, 1);
  // Re-render list
  addImgUrl(); // reuse logic (will show empty if no images)
}
async function handleImgUpload(input, spotId) {
  const file = input.files[0];
  if (!file) return;
  const url = await uploadScenicImage(file, spotId);
  if (url) {
    if (!window._scenicImgs) window._scenicImgs = [];
    window._scenicImgs.push(url);
    // Re-render list
    document.getElementById('newImgUrl').value = url; // set URL in the input
    addImgUrl();
  }
  input.value = '';
}

// ===== PUBLISH =====
async function publish() {
  const token = localStorage.getItem('github_token');
  if (!token) { toast('⚠️ 请先在"全局设置"中配置GitHub Token'); nav('cfg'); return; }

  toast('🚀 正在发布...');
  try {
    // Get current file SHA
    let sha = '';
    try {
      const getResp = await fetch(GITHUB_API, { headers: { Authorization: 'Bearer '+token } });
      if (getResp.ok) { const d = await getResp.json(); sha = d.sha; }
    } catch(e) {}

    // Prepare content
    const json = JSON.stringify(DB, null, 2);
    const body = {
      message: `📊 更新数据 - ${new Date().toLocaleString('zh-CN')}`,
      content: btoa(unescape(encodeURIComponent(json)))
    };
    if (sha) body.sha = sha;

    // Commit
    const resp = await fetch(GITHUB_API, {
      method: 'PUT',
      headers: { Authorization: 'Bearer '+token, 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });

    if (resp.ok) {
      pendingChanges = false;
      const meta = getMeta(); meta.lastPub = new Date().toISOString(); saveMeta(meta);
      toast('✅ 发布成功！客户端将在5分钟内自动更新');
      nav('dash');
    } else {
      const err = await resp.json().catch(()=>({}));
      toast('❌ 发布失败: ' + (err.message || '请检查Token权限'));
    }
  } catch(e) {
    toast('❌ 网络错误: ' + e.message);
  }
}

// ===== IMAGE UPLOAD TO GITHUB =====
async function uploadScenicImage(file, spotId) {
  const token = localStorage.getItem('github_token');
  if (!token) { toast('⚠️ 请先配置GitHub Token'); return null; }
  const ext = (file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');
  const filename = `images/scenic/${spotId}_${Date.now()}.${ext}`;
  const api = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${filename}`;
  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const body = { message: `📷 上传景区图片 - ${filename}`, content: base64 };
    const resp = await fetch(api, {
      method: 'PUT',
      headers: { Authorization: 'Bearer '+token, 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    if (resp.ok) {
      const url = `https://afei-chi.github.io/shuiquangou/${filename}`;
      return url;
    } else {
      const err = await resp.json().catch(()=>({}));
      toast('❌ 上传失败: ' + (err.message || '检查Token权限'));
      return null;
    }
  } catch(e) { toast('❌ 上传错误: ' + e.message); return null; }
}

function expJSON() {
  const json = JSON.stringify(DB, null, 2);
  const blob = new Blob([json],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='data.json'; a.click();
  URL.revokeObjectURL(url); toast('📥 已下载 data.json');
}
function copyJSON() {
  const json = JSON.stringify(DB, null, 2);
  if(navigator.clipboard?.writeText) { navigator.clipboard.writeText(json).then(()=>toast('✅ 已复制')).catch(()=>toast('⚠️ 失败')); }
  else { const ta=document.createElement('textarea'); ta.value=json; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('✅ 已复制'); }
}
function resetAll() { if(!confirm('⚠️ 确定恢复默认？当前数据将丢失！'))return; DB=getDefaultDB(); saveDB(DB); pendingChanges=false; toast('✅ 已恢复'); nav('dash'); }

// ===== TOAST =====
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== INIT =====
async function init() {
  DB = loadDB();
  window._dataSource = 'cache';  // 初始为本地缓存
  // 先立即渲染本地数据，避免长时间白屏
  nav('dash');
  // 后台从线上同步最新数据
  const synced = await syncFromRemote();
  if (synced) {
    console.log('✅ 已从线上同步数据，共' + DB.scenicSpots.length + '个景区');
    // 同步成功后刷新看板
    if (current === 'dash') nav('dash');
  } else if (!window._dataSource || window._dataSource === 'cache') {
    window._dataSource = 'cache';
  }
}
